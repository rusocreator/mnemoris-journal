const sessions=()=>db.sessions.filter(s=>s.done&&s.date>=from&&s.date<=to).sort((a,b)=>a.date.localeCompare(b.date)),measures=()=>db.body.filter(b=>b.date>=from&&b.date<=to).sort((a,b)=>a.date.localeCompare(b.date));function summary(health=false){let ss=sessions(),mins=0;for(let s of ss)for(let it of fact(s)){let j=lib[it.key][1].indexOf('Минуты');if(j>=0&&lib[it.key][3]==='Выносливость')for(let r of doneRows(it))if(r.v[j]!=='')mins+=+r.v[j]}return `Mnemoris | ${from} — ${to}\nАктивных дней: ${new Set(ss.map(s=>s.date)).size}; занятий: ${ss.length}; записанные минуты кардио: ${+mins.toFixed(2)}. Нет значения ≠ ноль.\n`+ss.map(s=>`\n${s.date} · ${title(s)} ${s.tag}\n`+s.items.map(it=>`${lib[it.key][0]} (план: ${it.plan}${it.orig!==lib[it.key][0]?'; вместо '+it.orig:''}) — ${it.skip?'пропущено':doneRows(it).map(r=>rowText(it,r)).join(' / ')||'нет данных'}`).join('\n')).join('\n')+(health?'\n\nЗамеры:\n'+measures().map(b=>`${b.date} — ${b.kg??'—'} кг; талия ${b.cm??'—'} см`).join('\n'):'')}
let metric='Повторы',chosen=null;function chart(){let ss=sessions(),data={};for(let s of ss)for(let it of fact(s))for(let r of doneRows(it))lib[it.key][1].forEach((f,j)=>{if(r.v[j]==='')return;let m=data[f]??={},vals=(m[it.key]??={})[s.date]??=[];vals.push(+r.v[j])});let fs=Object.keys(data);if(!fs.length)return '<p>Линии появятся после первой завершённой тренировки с числами.</p>';if(!fs.includes(metric))metric=fs[0];let series=data[metric],keys=Object.keys(series);let ks=chosen===null?keys.slice(0,4):keys.filter(k=>chosen.includes(k));let sum=/Минуты|Метры|Этажи|^Км$/.test(metric),vals=ks.flatMap(k=>Object.entries(series[k]).map(([d,v])=>({k,d,v:sum?v.reduce((a,b)=>a+b,0):Math.max(...v)}))),max=Math.max(...vals.map(x=>x.v),1),colors=['#c48521','#588ccb','#aa75c9','#4aa68b'],tn=d=>Date.parse(d+'T12:00:00Z'),x=d=>28+325*(tn(d)-tn(from))/Math.max(864e5,tn(to)-tn(from)),y=v=>94-76*v/max;return `<label>Единица сравнения<select onchange="metric=this.value;chosen=null;render()">${fs.map(f=>`<option ${f===metric?'selected':''}>${esc(f)}</option>`).join('')}</select></label><p><small>${sum?'Сумма за день':'Максимум одного отмеченного подхода за день'} · ${esc(metric)}. Цвета сравнивают только одинаковые единицы; пропуск не считается нулём.</small></p><div class="row">${keys.map(k=>btn((ks.includes(k)?'✓ ':'')+lib[k][0],`selectLine('${k}')`)).join('')}</div><svg class="spark" viewBox="0 0 380 112" role="img" aria-label="Динамика выбранных упражнений"><path d="M28 16V94H356" fill="none" stroke="currentColor" opacity=".3"/><text x="2" y="20" fill="currentColor" font-size="10">${+max.toFixed(1)}</text>${ks.map((k,i)=>{let ps=vals.filter(v=>v.k===k);return `<polyline points="${ps.map(p=>x(p.d)+','+y(p.v)).join(' ')}" fill="none" stroke="${colors[i]}" stroke-width="2"/>`+ps.map(p=>`<circle cx="${x(p.d)}" cy="${y(p.v)}" r="3" fill="${colors[i]}"><title>${esc(lib[k][0])}: ${p.d}, ${p.v}</title></circle>`).join('')}).join('')}</svg><div class="between"><small>${from}</small><small>${to}</small></div>${ks.map((k,i)=>`<small><b style="color:${colors[i]}">●</b> ${esc(lib[k][0])}　</small>`).join('')}<details><summary>Точные значения</summary>${vals.map(p=>`<small>${p.d} · ${lib[p.k][0]} · ${p.v}</small><br>`).join('')}</details>`}function selectLine(k){let all=[...new Set(sessions().flatMap(s=>fact(s).filter(it=>{let j=lib[it.key][1].indexOf(metric);return j>=0&&doneRows(it).some(r=>r.v[j]!=='')}).map(it=>it.key)))];let ks=chosen??all.slice(0,4);if(!ks.includes(k)&&ks.length>=4)return alert('Выбери не более четырёх линий: сначала отключи одну.');chosen=ks.includes(k)?ks.filter(x=>x!==k):[...ks,k];render()}
function period(n){let d=new Date(from+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+n);from=dt(d);d.setMonth(d.getMonth()+1,0);to=dt(d);chosen=null;render()}function report(){return `<div class="k">03 / НАБЛЮДЕНИЯ</div><h1>Динамика</h1>`+panel(`<div class="row">${btn('‹ Месяц','period(-1)')}<label>С<input type="date" value="${from}" onchange="if(dateOk(this.value)){from=this.value;render()}"></label><label>По<input type="date" value="${to}" onchange="if(dateOk(this.value)){to=this.value;render()}"></label>${btn('Месяц ›','period(1)')}</div>`)+(from>to?panel('Проверь границы периода.'):panel('<h2>Тренировочные показатели</h2><p>'+esc(summary().split('\n')[1])+'</p>'+chart())+panel(`<h2>Параметры тела</h2>${btn('Добавить замер','bodyForm()')}<p><small>Одна запись на дату, отдельно от тренировок. Для сравнения измеряй в сходных условиях.</small></p>${bodyTrend('kg','Вес · кг')}${bodyTrend('cm','Талия · см')}${measures().map(b=>`<div class="list">${b.date} · ${b.kg??'—'} кг · талия ${b.cm??'—'} см　${btn('Исправить',`bodyForm('${b.date}')`)}</div>`).join('')}`)+panel(`<label><input type="checkbox" id="health"> Включить замеры тела в сводку</label><div class="row">${btn('Текст для нейросети','output()')}${btn('Печать отчёта','printReport()')}</div>`))}function bodyTrend(key,label){let a=measures().filter(b=>b[key]!==null);if(!a.length)return '';let lo=Math.min(...a.map(b=>b[key])),hi=Math.max(...a.map(b=>b[key])),ds=t=>Date.parse(t+'T12:00:00Z'),xy=b=>[25+325*(ds(b.date)-ds(from))/Math.max(864e5,ds(to)-ds(from)),hi===lo?50:90-70*(b[key]-lo)/(hi-lo)];return `<h3>${label}</h3><small>${a.length===1?'Один замер · '+a[0].date+': '+a[0][key]+' (для сравнения нужен следующий)':a[0].date+': '+a[0][key]+' → '+a.at(-1).date+': '+a.at(-1)[key]}</small><svg class="spark" viewBox="0 0 380 110" role="img" aria-label="${label}"><path d="M25 95H350" stroke="currentColor" opacity=".2"/><polyline points="${a.map(b=>xy(b).join(',')).join(' ')}" fill="none" stroke="var(--a)" stroke-width="2"/>${a.map(b=>`<circle r="3" cx="${xy(b)[0]}" cy="${xy(b)[1]}" fill="var(--a)"><title>${b.date}: ${b[key]}</title></circle>`).join('')}</svg>`}
function bodyForm(d=dt()){let b=db.body.find(x=>x.date===d)||{};show(`<h2>Замер</h2><label>Дата<input id="bd" type="date" value="${d}" onchange="if(dateOk(this.value))bodyForm(this.value)"></label><label>Вес, кг<input id="kg" type="number" min="0.1" step="any" value="${b.kg??''}"></label><label>Талия, см<input id="cm" type="number" min="0.1" step="any" value="${b.cm??''}"></label><p>${btn('Сохранить замер','saveBody()')} ${b.date?btn('Удалить замер',`if(confirm('Удалить этот замер?')){db.body=db.body.filter(b=>b.date!=='${d}');save();dlg.close();render()}`):''}</p>`)}function saveBody(){let b={date:$('#bd').value};for(let k of ['kg','cm']){let e=$('#'+k);if(!e.validity.valid)return e.reportValidity();b[k]=e.value?Number(e.value):null}if(!dateOk(b.date)||(!b.kg&&!b.cm))return alert('Нужны дата и хотя бы одно значение');db.body=db.body.filter(x=>x.date!==b.date);db.body.push(b);save();dlg.close();render()}function output(){show(`<h2>Сводка для анализа</h2><textarea id="out" rows="12" readonly>${esc(summary($('#health').checked))}</textarea>${btn('Скопировать','copyText()')}`)}async function copyText(){try{await navigator.clipboard.writeText($('#out').value);dlg.close()}catch{$('#out').select();alert('Текст выделен. Используй «Копировать».')}}function printReport(){$('#pr').innerHTML='<pre style="white-space:pre-wrap">'+esc(summary($('#health').checked))+'</pre>';print()}function printS(){let s=S();$('#pr').innerHTML=`<h2>${esc(title(s))} · ${s.date}</h2><div class="cols">${s.items.map(it=>`<p><b>${lib[it.key][0]}</b> · ${esc(it.plan)}<br>${esc(lib[it.key][2])}<br>${it.skip?'Пропущено':it.rows.map(r=>r.ok?esc(rowText(it,r)):'□ ______').join(' / ')}</p>`).join('')}</div><p>${esc(s.note)}</p>`;print()}
function more(){return `<div class="k">04 / МАСТЕРСКАЯ</div><h1>Ещё</h1>`+panel(`<h2>Мои ориентиры</h2><label>Строка на главной<input maxlength="160" value="${esc(db.motto)}" oninput="db.motto=this.value;save()"></label><p>${btn('+ Карточка','taskForm()')}</p><div class="board">${['Намечено','В процессе','Завершено'].map((n,j)=>`<div><b>${n}</b>${db.tasks.map((t,i)=>t.stage===j?`<section><b>${esc(t.name)}</b><p>${esc(t.note)}</p>${safeURL(t.link)?`<a href="${esc(t.link)}" target="_blank" rel="noopener noreferrer">Материал ↗</a>`:''}${btn('Изменить',`taskForm(${i})`)}</section>`:'').join('')}</div>`).join('')}</div>`)+panel(`<h2>Библиотека · ${Object.keys(lib).length}</h2><p>${btn('Открыть справочник',`library(-1,'read')`)} ${btn('Изменить состав сборов','editKit()')}</p>`)+panel(`<h2>Личный архив</h2><p>Сохраняется только в этом браузере. Копия содержит тренировки, корзину, замеры и личные карточки; не публикуй её в репозитории.</p>${btn('Скачать копию','backup()')} ${btn('Восстановить из файла',`$('#file').click()`)}<details><summary>Корзина (${db.trash.length})</summary>${db.trash.map((s,i)=>`<div class="list">${s.date} · ${esc(title(s))} · ${fact(s).length} упр. ${btn('Восстановить',`restoreOne(${i})`)}</div>`).join('')}</details>`)}function safeURL(s){try{return ['http:','https:'].includes(new URL(s).protocol)}catch{return false}}function taskForm(i=-1){let t=db.tasks[i]||{name:'',note:'',link:'',stage:0};show(`<h2>Карточка ориентира</h2><label>Следующий шаг<input id="tn" maxlength="160" value="${esc(t.name)}"></label><label>Заметка<textarea id="tc">${esc(t.note)}</textarea></label><label>Ссылка на материал<input id="tl" value="${esc(t.link)}"></label><label>Статус<select id="ts">${['Намечено','В процессе','Завершено'].map((n,j)=>`<option value="${j}" ${j===t.stage?'selected':''}>${n}</option>`).join('')}</select></label><p>${btn('Сохранить карточку',`saveTask(${i})`)} ${i<0?'':btn('Удалить',`if(confirm('Удалить карточку?')){db.tasks.splice(${i},1);save();dlg.close();render()}`)}</p>`)}function saveTask(i){let t={name:$('#tn').value.trim(),note:$('#tc').value,link:$('#tl').value.trim(),stage:+$('#ts').value};if(!t.name||t.link&&!safeURL(t.link))return alert('Нужно название; ссылка — только http(s).');db.tasks[i<0?db.tasks.length:i]=t;save();dlg.close();render()}
function backup(){let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='mnemoris-03-'+dt()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}$('#file').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{check(f.size<20e6);let d=validate(JSON.parse(await f.text()));if(!confirm(`Заменить текущий журнал копией? Занятий в копии: ${d.sessions.length}.`))return;let json=JSON.stringify(d);localStorage.setItem(K,json);db=d;last=json;fatal=false;go('Сегодня')}catch{alert('Не удалось восстановить данные. Текущий журнал не заменён.')}};try{last=localStorage.getItem(K);let raw=last??localStorage.getItem('mnemoris.local.v2')??localStorage.getItem(OLD);if(raw)db=validate(JSON.parse(raw));else db.tasks=['Пройти две основные тренировки','Уточнить набор в школу проводников','Обсудить с гидом район Тянь-Шаня'].map(name=>({name,note:'',stage:0,link:''}));$('#status').textContent='На этом устройстве · Mnemoris 0.3';render()}catch{fatal=true;main.innerHTML=panel('Не удалось открыть локальную запись. Она не перезаписана. '+btn('Восстановить копию',`$('#file').click()`))}if(location.protocol==='https:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
